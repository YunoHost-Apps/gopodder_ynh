packaging_format = 2

id = "gopodder"
name = "goPodder"

description.en = "Podcast synchronization server compatible with the gPodder API"
description.fr = "Serveur de synchronisation de podcast compatible avec l'API gPodder"

version = "1.4.3~ynh1"

maintainers = []

[upstream]
license = "Apache-2.0"
code = "https://github.com/cbrgm/gopodder"

[integration]
yunohost = '>= 12.1.40'
helpers_version = "2.1"
architectures = ["amd64", "arm64", "i386"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"
    
    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

        [resources.sources.main]
        in_subdir = false
        extract = false
        rename = "gopodder"

        amd64.url = "https://github.com/cbrgm/gopodder/releases/download/v1.4.3/gopodder_linux-amd64"
        amd64.sha256 = "a2000f4c0326dcccc5006fa687d0a9f2c5a5ef645361c2944021987bbceb524b"
        arm64.url = "https://github.com/cbrgm/gopodder/releases/download/v1.4.3/gopodder_linux-arm64"
        arm64.sha256 = "a454aea0adb5ca093d59ec7a0a9f195d693841b14c6f7b7203c0b25758b7226c"
        i386.url = "https://github.com/cbrgm/gopodder/releases/download/v1.4.3/gopodder_linux-386"
        i386.sha256 = "8a9fac917fdd42bca529185bb25b01f02aae0c3db0aa54e234bf0c545b10722a"

        autoupdate.strategy = "latest_github_release"
        autoupdate.asset.amd64 = "^gopodder_linux-amd64$"
        autoupdate.asset.arm64 = "^gopodder_linux-arm64$"
        autoupdate.asset.i386 = "^gopodder_linux-386$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.show_tile = true
    main.auth_header = false

    [resources.ports]
    main.default = 18080
    main.exposed = false
