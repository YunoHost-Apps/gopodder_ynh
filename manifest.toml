packaging_format = 2

id = "gopodder"
name = "goPodder"

description.en = "Podcast synchronization server compatible with the gPodder API"
description.fr = "Serveur de synchronisation de podcast compatible avec l'API gPodder"

version = "1.4.2~ynh1"

maintainers = []

[upstream]
license = "Apache-2.0"
code = "https://github.com/cbrgm/gopodder"

[integration]
yunohost = '>= 12.1.40'
helpers_version = "2.1"
architectures = ["amd64", "arm64", "i386"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"
    
    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

        [resources.sources.main]
        in_subdir = false
        extract = false
        rename = "gopodder"

        amd64.url = "https://github.com/cbrgm/gopodder/releases/download/v1.4.2/gopodder_linux-amd64"
        amd64.sha256 = "09067bb52401a635a5e047dd5ed9ab82276e18ab1b75a9056c4161c57afc45af"
        arm64.url = "https://github.com/cbrgm/gopodder/releases/download/v1.4.2/gopodder_linux-arm64"
        arm64.sha256 = "ea5dc5a45459ef8895ac332d7358227cb643b3993c63166d3713cc4248a6019d"
        i386.url = "https://github.com/cbrgm/gopodder/releases/download/v1.4.2/gopodder_linux-386"
        i386.sha256 = "e9f1e27227f8bce53e2c09278395563dd0438e300221fe2e5d4b456c77a28f3b"

        autoupdate.strategy = "latest_github_release"
        autoupdate.asset.amd64 = "^gopodder_linux-amd64$"
        autoupdate.asset.arm64 = "^gopodder_linux-arm64$"
        autoupdate.asset.i386 = "^gopodder_linux-386$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.show_tile = true
    main.auth_header = false

    [resources.ports]
    main.default = 18080
    main.exposed = false
