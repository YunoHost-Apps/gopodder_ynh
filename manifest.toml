packaging_format = 2

id = "gopodder"
name = "goPodder"

description.en = "Podcast synchronization server compatible with the gPodder API"
description.fr = "Serveur de synchronisation de podcast compatible avec l'API gPodder"

version = "1.2.5~ynh1"

maintainers = []

[upstream]
license = "Apache-2.0"
code = "https://github.com/cbrgm/gopodder"

[integration]
yunohost = '>= 12.1.40'
helpers_version = "2.1"
architectures = ["amd64", "arm64", "i386"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"
    
    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

        [resources.sources.main]
        in_subdir = false
        extract = false
        rename = "gopodder"

        amd64.url = "https://github.com/cbrgm/gopodder/releases/download/v1.2.5/gopodder_linux-amd64"
        amd64.sha256 = "865f1df9e4375ba55ab21df8c7f7dd57782f2e06e2d8995922036fd22b48367e"
        arm64.url = "https://github.com/cbrgm/gopodder/releases/download/v1.2.5/gopodder_linux-arm64"
        arm64.sha256 = "1206d1747a528105169b52e8713a33b0b47375e796c2ee2ace7e418634167bb3"
        i386.url = "https://github.com/cbrgm/gopodder/releases/download/v1.2.5/gopodder_linux-386"
        i386.sha256 = "2ddb55d7d2d19db428e4686512a2cc2666da0ab89b191ed40c1cac0a7fe22c22"

        autoupdate.strategy = "latest_github_release"
        autoupdate.asset.amd64 = "^gopodder_linux-amd64$"
        autoupdate.asset.arm64 = "^gopodder_linux-arm64$"
        autoupdate.asset.i386 = "^gopodder_linux-386$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.show_tile = true
    main.auth_header = false

    [resources.ports]
    main.default = 18080
    main.exposed = false
