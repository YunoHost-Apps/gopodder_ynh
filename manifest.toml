packaging_format = 2

id = "gopodder"
name = "goPodder"

description.en = "Podcast synchronization server compatible with the gPodder API"
description.fr = "Serveur de synchronisation de podcast compatible avec l'API gPodder"

version = "1.4.1~ynh1"

maintainers = []

[upstream]
license = "Apache-2.0"
code = "https://github.com/cbrgm/gopodder"

[integration]
yunohost = '>= 12.1.40'
helpers_version = "2.1"
architectures = ["amd64", "arm64", "i386"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"
    
    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

        [resources.sources.main]
        in_subdir = false
        extract = false
        rename = "gopodder"

        amd64.url = "https://github.com/cbrgm/gopodder/releases/download/v1.4.1/gopodder_linux-amd64"
        amd64.sha256 = "153962c2dc119ab095a473e0add9577e2be866f3761a6dc78e76bea48c49e40a"
        arm64.url = "https://github.com/cbrgm/gopodder/releases/download/v1.4.1/gopodder_linux-arm64"
        arm64.sha256 = "f053d6471a8eea6fa45747597d93d9a0211a146d06b20ff413e178ed66371c18"
        i386.url = "https://github.com/cbrgm/gopodder/releases/download/v1.4.1/gopodder_linux-386"
        i386.sha256 = "724e811769df2d3e48502f0b164302ff18e02b96e2c5997a48bd5bbae435b3cc"

        autoupdate.strategy = "latest_github_release"
        autoupdate.asset.amd64 = "^gopodder_linux-amd64$"
        autoupdate.asset.arm64 = "^gopodder_linux-arm64$"
        autoupdate.asset.i386 = "^gopodder_linux-386$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.show_tile = true
    main.auth_header = false

    [resources.ports]
    main.default = 18080
    main.exposed = false
