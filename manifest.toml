packaging_format = 2

id = "gopodder"
name = "goPodder"

description.en = "Podcast synchronization server compatible with the gPodder API"
description.fr = "Serveur de synchronisation de podcast compatible avec l'API gPodder"

version = "1.4.4~ynh1"

maintainers = []

[upstream]
license = "Apache-2.0"
code = "https://github.com/cbrgm/gopodder"

[integration]
yunohost = '>= 12.1.40'
helpers_version = "2.1"
architectures = ["amd64", "arm64", "i386"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"
    
    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

        [resources.sources.main]
        in_subdir = false
        extract = false
        rename = "gopodder"

        amd64.url = "https://github.com/cbrgm/gopodder/releases/download/v1.4.4/gopodder_linux-amd64"
        amd64.sha256 = "77155cce60cdaaaa795e317b5dabdb8eb7e83c1eb353894b35fb3a1fa32c98d9"
        arm64.url = "https://github.com/cbrgm/gopodder/releases/download/v1.4.4/gopodder_linux-arm64"
        arm64.sha256 = "29475fbd0b7ba1e7a0b3135852728ae98267329dfe32f734c8f515d3eb2fdb3e"
        i386.url = "https://github.com/cbrgm/gopodder/releases/download/v1.4.4/gopodder_linux-386"
        i386.sha256 = "0255c99608109eee1d16c2d7b7879ebd0df9dcc5b43d50f2911d97c5d1db08b9"

        autoupdate.strategy = "latest_github_release"
        autoupdate.asset.amd64 = "^gopodder_linux-amd64$"
        autoupdate.asset.arm64 = "^gopodder_linux-arm64$"
        autoupdate.asset.i386 = "^gopodder_linux-386$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.show_tile = true
    main.auth_header = false

    [resources.ports]
    main.default = 18080
    main.exposed = false
